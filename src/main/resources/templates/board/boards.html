<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <!-- Bootstrap CSS -->
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons (Optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link
      href="https://font.elice.io/css?family=Elice+DX+Neolli"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />

    <style>
      html,
      body {
        font-family: "Elice DX Neolli", sans-serif;
      }

      .card {
        transition: all 0.1s ease-in-out;
      }

      .card:hover {
        transform: scale(1.01);
      }

      .board-item:hover {
        cursor: pointer;
      }

      .board-item > .btn-group {
        display: none;
      }

      .board-item:hover > .btn-group {
        display: flex;
      }
    </style>

    <!-- 비회원 네비게이션 바 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light" th:if="${member == null}">
      <div class="container px-4 px-lg-5">
        <a class="navbar-brand" th:href="@{/boards}">8Mile</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="noMemberNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
          </ul>
          <form th:action="@{/}" class="d-flex">
            <button class="btn btn-outline-secondary" type="submit">로그인</button>
          </form>
          &nbsp;
          <form th:action="@{/signup}" class="d-flex">
            <button class="btn btn-outline-secondary" type="submit">회원가입</button>
          </form>
        </div>
      </div>
    </nav>

    <!-- 회원 네비게이션 바 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light" th:if="${member != null}">
      <div class="container px-4 px-lg-5">
        <a class="navbar-brand" th:href="@{/boards}">8Mile</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#MemberNav" aria-controls="MemberNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="MemberNav">

          <!-- 오른쪽 정렬 -->
          <div class="d-flex w-100 justify-content-end align-items-center">
            <!-- 내 정보 -->
            <ul class="navbar-nav mb-2 mb-lg-0 me-3 d-flex align-items-center">
              <li class="nav-item dropdown">
                <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" th:text="${member.userName}" role="button" data-bs-toggle="dropdown" aria-expanded="false">내 정보</a>
                <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                  <li><a class="dropdown-item" th:href="@{/items/new}">회원 정보</a></li>
                  <li><hr class="dropdown-divider" /></li>
                  <li><a class="dropdown-item" th:href="@{/items}">북마크</a></li>
                </ul>
              </li>
            </ul>

            <!-- 로그아웃 -->
            <form th:action="@{/logout}" class="d-flex me-3" method="post">
              <button class="btn btn-outline-dark" type="submit">로그아웃</button>
            </form>

          </div>
        </div>
      </div>
    </nav>




    <title>8Mile</title>
  </head>
  <body>
    <div class="container my-5">
      <div class="header mb-5">
        <h1 class="text-center">영화 리뷰</h1>
      </div>

      <div class="btn-group me-3" role="group" aria-label="sorting">
        <a th:href="@{/boards(sort='latest')}"  href="/boards?sort=latest" class="btn btn-outline-primary">최신순 </a>
        <a th:href="@{/boards(sort='popular')}" href="/boards?sort=popular" class="btn btn-outline-primary">인기순</a>
      </div>

      <div class="d-flex justify-content-end mb-3">
        <a th:if="${member != null}" th:href="@{/boards/create}" class="btn btn-success">장르 추가</a>
      </div>
      <div class="container p-0">
        <div class="row row-cols-3 position-relative">
          <div
            class="col mb-3"
            th:unless="${#lists.isEmpty(boards)}"
            th:each="board : ${boards}"
          >
            <div
              class="card"
              onmouseover="event.currentTarget.classList.add('shadow')"
              onmouseleave="event.currentTarget.classList.remove('shadow')"
            >
              <a
                class="board-item pe-auto p-3 link-underline link-underline-opacity-0 d-flex"
                th:href="@{/boards/{boardId}(boardId=${board.id})}"
              >
                <img
                  class="img-thumbnail w-50 h-50 me-3"
                  src="../../static/film.jpg"
                  alt="hellobit"
                />
                <div>
                  <h4
                    class="card-title fw-bold text-dark"
                    th:text="${board.name}"
                  >
                    장르 이름
                  </h4>
                  <span
                    class="card-text text-secondary text-wrap"
                    th:text="${board.description}"
                    >장르 설명</span
                  >
                </div>
                <div class="position-absolute end-0 bottom-0 mb-3 me-3">
                  <span class="card-text text-secondary text-wrap d-block mb-2" th:text="'조회수 : ' + ${board.viewCount}">조회수</span>
                  <div class="btn-group bg-white bg-opacity-75" role="group" aria-label="edit-delete">
                    <button class="btn btn-outline-primary lh-1" th:onclick="'event.preventDefault(); location.href=\'/boards/' + ${board.id} + '/edit\''">
                      <span class="material-symbols-outlined">edit</span>
                    </button>
                    <button class="btn btn-outline-danger lh-1" data-bs-toggle="modal" data-bs-target="#deleteModal" th:onclick="handleDeleteButton(event, [[${board.id}]]);">
                      <span class="material-symbols-outlined">delete</span>
                    </button>
                  </div>
                </div>
              </a>
            </div>
          </div>
        </div>
        <span
          th:if="${#lists.isEmpty(boards)}"
          class="d-block w-100 text-center"
          >생성된 장르 게시판이 없습니다.</span
        >
      </div>
    </div>

    <div
      class="modal fade"
      id="deleteModal"
      tabindex="-1"
      aria-labelledby="deleteModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="deleteModalLabel">
              장르 게시판을 삭제하시겠습니까?
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <p class="fw-light">게시판에 포함된 모든 게시글이 삭제됩니다.</p>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              취소
            </button>
            <button
              type="button"
              class="btn btn-danger"
              onclick="handleDeleteModalButton()"
            >
              삭제
            </button>
          </div>
        </div>
      </div>
    </div>

    <script th:inline="javascript">
      let currentBoard;

      function handleDeleteButton(e, boardId) {
        e.preventDefault();
        currentBoard = boardId;
      }

      function handleDeleteModalButton() {
        fetch(`/boards/${currentBoard}/delete`, {
          method: "DELETE",
        }).then(() => (window.location.href = "/boards"));
      }
    </script>

    <!-- 부트스트랩 JS 추가 -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
